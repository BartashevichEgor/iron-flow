    const RPE_OPTIONS = [
      { id: 'easy', label: 'Легко', icon: 'feather' },
      { id: 'optimal', label: 'Оптимально', sub: '1–2 в запасе', icon: 'gauge-high' },
      { id: 'hard', label: 'Тяжело / Отказ', icon: 'fire' }
    ];

    const todayKey = () => {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };

    const getWeekKey = (date = new Date()) => {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const day = d.getDay() || 7;
      d.setDate(d.getDate() - day + 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const DEFAULT_STATE = {
      schema: 9,
      updatedAt: Date.now(),
      profile: { height: 188, weight: 79.6, muscle: 34.6, fat: 19, proteinGoal: 120 },
      protein: { date: todayKey(), grams: 0 },
      proteinHistory: [],
      health: { lastSyncAt: null, lastImportId: '', latest: {}, history: [] },
      measurements: [],
      measurementTombstones: [],
      weeks: {},
      history: []
    };

    const cloneDefault = () => JSON.parse(JSON.stringify(DEFAULT_STATE));
    const normalizeState = (value) => {
      const base = cloneDefault();
      if (!value || typeof value !== 'object') return base;
      const bodyKeys = ['height', 'weight', 'muscle', 'fat'];
      const measurementTombstones = (Array.isArray(value.measurementTombstones) ? value.measurementTombstones : [])
        .filter(item => item && typeof item.id === 'string' && bodyKeys.includes(item.metric))
        .map(item => ({ id: item.id, metric: item.metric, deletedAt: Number(item.deletedAt || 0) }));
      const deletedKeys = new Set(measurementTombstones.map(item => `${item.id}\u0000${item.metric}`));
      const rawMeasurements = Array.isArray(value.measurements)
        ? value.measurements
        : (Array.isArray(value.health?.history) ? value.health.history.filter(entry => bodyKeys.some(key => Number(entry?.[key]) > 0)).map(entry => ({ ...entry, source: 'health' })) : []);
      const measurements = rawMeasurements.map(entry => {
        const next = { ...entry };
        bodyKeys.forEach(metric => { if (deletedKeys.has(`${entry.id}\u0000${metric}`)) delete next[metric]; });
        return next;
      }).filter(entry => bodyKeys.some(key => Number(entry?.[key]) > 0));
      const healthHistory = (Array.isArray(value.health?.history) ? value.health.history : []).map(entry => {
        const next = { ...entry };
        bodyKeys.forEach(metric => { if (deletedKeys.has(`health-${entry.id}\u0000${metric}`)) delete next[metric]; });
        return next;
      });
      const healthLatest = value.health?.latest && typeof value.health.latest === 'object' ? { ...value.health.latest } : {};
      bodyKeys.forEach(metric => {
        if (!deletedKeys.has(`health-${healthLatest.id}\u0000${metric}`)) return;
        delete healthLatest[metric];
        const previous = [...healthHistory].reverse().find(entry => Number(entry?.[metric]) > 0);
        if (previous) healthLatest[metric] = previous[metric];
      });
      return {
        ...base,
        ...value,
        schema: 9,
        profile: { ...base.profile, ...(value.profile || {}) },
        protein: { ...base.protein, ...(value.protein || {}) },
        proteinHistory: Array.isArray(value.proteinHistory)
          ? value.proteinHistory
          : (value.protein?.date ? [{ date: value.protein.date, grams: Number(value.protein.grams || 0), updatedAt: value.updatedAt || Date.now() }] : []),
        health: {
          ...base.health,
          ...(value.health || {}),
          latest: healthLatest,
          history: healthHistory
        },
        measurements,
        measurementTombstones,
        weeks: value.weeks && typeof value.weeks === 'object' ? value.weeks : {},
        history: Array.isArray(value.history) ? value.history : []
      };
    };

    const safeTime = value => {
      const parsed = typeof value === 'number' ? value : new Date(value || 0).getTime();
      return Number.isFinite(parsed) ? parsed : 0;
    };

    const exerciseScore = entry => {
      if (!entry || typeof entry !== 'object') return -1;
      return (entry.completed ? 100 : 0)
        + (entry.rpe ? 12 : 0)
        + (entry.weight !== '' && entry.weight != null ? 8 : 0)
        + (Array.isArray(entry.reps) ? entry.reps.filter(value => value !== '' && value != null).length * 3 : 0)
        + (entry.mode ? 4 : 0)
        + (entry.minutes !== '' && entry.minutes != null ? 4 : 0);
    };

    const mergeExercise = (localEntry, remoteEntry, localFallback = 0, remoteFallback = 0) => {
      if (!localEntry) return remoteEntry ? { ...remoteEntry } : localEntry;
      if (!remoteEntry) return { ...localEntry };
      const localTime = safeTime(localEntry._updatedAt);
      const remoteTime = safeTime(remoteEntry._updatedAt);
      if ((localTime || remoteTime) && localTime !== remoteTime) return { ...(localTime > remoteTime ? remoteEntry : localEntry), ...(localTime > remoteTime ? localEntry : remoteEntry) };
      const localScore = exerciseScore(localEntry);
      const remoteScore = exerciseScore(remoteEntry);
      if (localScore !== remoteScore) return { ...(localScore > remoteScore ? remoteEntry : localEntry), ...(localScore > remoteScore ? localEntry : remoteEntry) };
      const localWins = safeTime(localFallback) >= safeTime(remoteFallback);
      return { ...(localWins ? remoteEntry : localEntry), ...(localWins ? localEntry : remoteEntry) };
    };

    const mergeWeeks = (localWeeks, remoteWeeks, localUpdatedAt = 0, remoteUpdatedAt = 0) => {
      const result = {};
      const weekKeys = [...new Set([...Object.keys(localWeeks || {}), ...Object.keys(remoteWeeks || {})])].sort();
      weekKeys.forEach(weekKey => {
        const localWeek = localWeeks?.[weekKey] || {};
        const remoteWeek = remoteWeeks?.[weekKey] || {};
        const mergedWeek = {};
        [...new Set([...Object.keys(localWeek), ...Object.keys(remoteWeek)])].sort().forEach(dayId => {
          const localDay = localWeek[dayId] || {};
          const remoteDay = remoteWeek[dayId] || {};
          const exercises = {};
          [...new Set([...Object.keys(localDay.exercises || {}), ...Object.keys(remoteDay.exercises || {})])].sort().forEach(exerciseId => {
            exercises[exerciseId] = mergeExercise(
              localDay.exercises?.[exerciseId],
              remoteDay.exercises?.[exerciseId],
              localDay.updatedAt || localUpdatedAt,
              remoteDay.updatedAt || remoteUpdatedAt
            );
          });
          const localDayIsNewer = safeTime(localDay.updatedAt || localUpdatedAt) >= safeTime(remoteDay.updatedAt || remoteUpdatedAt);
          mergedWeek[dayId] = {
            ...(localDayIsNewer ? remoteDay : localDay),
            ...(localDayIsNewer ? localDay : remoteDay),
            updatedAt: Math.max(safeTime(localDay.updatedAt), safeTime(remoteDay.updatedAt)),
            exercises
          };
        });
        result[weekKey] = mergedWeek;
      });
      return result;
    };

    const historyScore = record => Number(record?.completedExercises || 0) * 1000 + Number(record?.tonnage || 0) + (record?.exercises?.length || 0) * 10;
    const mergeHistory = (localHistory, remoteHistory) => {
      const records = new Map();
      [...(localHistory || []), ...(remoteHistory || [])].forEach(record => {
        if (!record?.id) return;
        const existing = records.get(record.id);
        if (!existing) { records.set(record.id, { ...record }); return; }
        const existingTime = safeTime(existing.updatedAt);
        const recordTime = safeTime(record.updatedAt);
        const existingScore = historyScore(existing);
        const recordScore = historyScore(record);
        if ((recordTime || existingTime) && recordTime > existingTime) records.set(record.id, { ...record });
        else if (!recordTime && !existingTime && (recordScore > existingScore || (recordScore === existingScore && safeTime(record.date) > safeTime(existing.date)))) records.set(record.id, { ...record });
      });
      return [...records.values()].sort((a, b) => safeTime(a.date) - safeTime(b.date));
    };

    const mergeHealthHistory = (localHistory, remoteHistory) => {
      const entries = new Map();
      [...(localHistory || []), ...(remoteHistory || [])].forEach(entry => {
        if (!entry?.id) return;
        const existing = entries.get(entry.id);
        if (!existing || safeTime(entry.timestamp) >= safeTime(existing.timestamp)) entries.set(entry.id, { ...existing, ...entry });
      });
      return [...entries.values()].sort((a, b) => safeTime(a.timestamp) - safeTime(b.timestamp));
    };

    const mergeMeasurements = (localMeasurements, remoteMeasurements) => {
      const entries = new Map();
      [...(localMeasurements || []), ...(remoteMeasurements || [])].forEach(entry => {
        if (!entry?.id) return;
        const existing = entries.get(entry.id);
        if (!existing || safeTime(entry.timestamp) >= safeTime(existing.timestamp)) entries.set(entry.id, { ...existing, ...entry });
      });
      return [...entries.values()].sort((a, b) => safeTime(a.timestamp) - safeTime(b.timestamp));
    };

    const mergeMeasurementTombstones = (localItems, remoteItems) => {
      const entries = new Map();
      [...(localItems || []), ...(remoteItems || [])].forEach(item => {
        if (!item?.id || !item?.metric) return;
        const key = `${item.id}\u0000${item.metric}`;
        const existing = entries.get(key);
        if (!existing || Number(item.deletedAt || 0) >= Number(existing.deletedAt || 0)) entries.set(key, { ...item });
      });
      return [...entries.values()];
    };

    const mergeProteinHistory = (localHistory, remoteHistory) => {
      const days = new Map();
      [...(localHistory || []), ...(remoteHistory || [])].forEach(entry => {
        if (!entry?.date) return;
        const existing = days.get(entry.date);
        if (!existing || safeTime(entry.updatedAt) >= safeTime(existing.updatedAt)) days.set(entry.date, { date: entry.date, grams: Math.max(0, Number(entry.grams || 0)), updatedAt: safeTime(entry.updatedAt) || Date.now() });
      });
      return [...days.values()].sort((a, b) => a.date.localeCompare(b.date));
    };

    const mergeStateData = (localInput, remoteInput) => {
      const local = normalizeState(localInput);
      const remote = normalizeState(remoteInput);
      const localIsNewer = safeTime(local.updatedAt) >= safeTime(remote.updatedAt);
      const newer = localIsNewer ? local : remote;
      const older = localIsNewer ? remote : local;
      const localHealthTime = safeTime(local.health?.lastSyncAt || local.health?.latest?.timestamp);
      const remoteHealthTime = safeTime(remote.health?.lastSyncAt || remote.health?.latest?.timestamp);
      const latestHealth = localHealthTime >= remoteHealthTime ? local.health : remote.health;
      const proteinHistory = mergeProteinHistory(
        mergeProteinHistory(local.proteinHistory, local.protein?.date ? [{ ...local.protein, updatedAt: local.updatedAt }] : []),
        mergeProteinHistory(remote.proteinHistory, remote.protein?.date ? [{ ...remote.protein, updatedAt: remote.updatedAt }] : [])
      );
      const latestProtein = proteinHistory.find(entry => entry.date === todayKey());
      return normalizeState({
        ...older,
        ...newer,
        schema: 9,
        updatedAt: Math.max(safeTime(local.updatedAt), safeTime(remote.updatedAt)),
        weeks: mergeWeeks(local.weeks, remote.weeks, local.updatedAt, remote.updatedAt),
        history: mergeHistory(local.history, remote.history),
        measurements: mergeMeasurements(local.measurements, remote.measurements),
        measurementTombstones: mergeMeasurementTombstones(local.measurementTombstones, remote.measurementTombstones),
        proteinHistory,
        protein: latestProtein ? { date: latestProtein.date, grams: latestProtein.grams } : newer.protein,
        health: {
          ...older.health,
          ...latestHealth,
          history: mergeHealthHistory(local.health?.history, remote.health?.history)
        }
      });
    };

    const workoutRecordFor = (state, weekKey, dayId, existing) => {
      const workout = DAYS.find(day => day.id === dayId);
      if (!workout) return null;
      const day = state.weeks?.[weekKey]?.[dayId] || {};
      const entries = day.exercises || {};
      if (!workout.exercises.every(exercise => entries[exercise.id]?.completed)) return null;
      const exercises = workout.exercises.map(exercise => {
        const entry = entries[exercise.id] || {};
        const reps = Array.isArray(entry.reps) ? entry.reps : [];
        const volume = exercise.multiplier ? Number(entry.weight || 0) * reps.reduce((sum, value) => sum + Number(value || 0), 0) * exercise.multiplier : 0;
        return { id: exercise.id, name: exercise.name, kind: exercise.kind, unit: exercise.unit || 'повт.', weight: Number(entry.weight || 0), reps, rpe: entry.rpe || '', mode: entry.mode || '', completed: Boolean(entry.completed), volume };
      });
      const fallbackDate = (() => {
        if (weekKey === getWeekKey()) return new Date().toISOString();
        const date = new Date(`${weekKey}T12:00:00`);
        date.setDate(date.getDate() + workout.weekday - 1);
        return date.toISOString();
      })();
      const candidate = {
        id: `${weekKey}-${dayId}`,
        weekKey,
        workoutId: dayId,
        title: workout.title,
        date: existing?.date || (day.completedAt ? new Date(day.completedAt).toISOString() : fallbackDate),
        tonnage: exercises.reduce((sum, exercise) => sum + exercise.volume, 0),
        completedExercises: workout.exercises.length,
        note: String(day.note || ''),
        startedAt: day.startedAt || null,
        completedAt: day.completedAt || null,
        durationMinutes: day.startedAt && day.completedAt ? Math.max(1, Math.round((safeTime(day.completedAt) - safeTime(day.startedAt)) / 60000)) : null,
        exercises
      };
      const comparable = record => JSON.stringify({ ...record, date: null, updatedAt: null });
      if (existing && comparable(existing) === comparable(candidate)) return existing;
      return { ...candidate, updatedAt: Math.max(Date.now(), safeTime(day.updatedAt), ...Object.values(entries).map(entry => safeTime(entry?._updatedAt))) };

    const repairCompletedHistory = input => {
      const state = normalizeState(input);
      let history = state.history || [];
      let changed = false;
      Object.keys(state.weeks || {}).forEach(weekKey => {
        DAYS.forEach(day => {
          const id = `${weekKey}-${day.id}`;
          const existing = history.find(record => record.id === id);
          const record = workoutRecordFor(state, weekKey, day.id, existing);
          if (!record || record === existing) return;
          history = existing ? history.map(item => item.id === id ? record : item) : [...history, record];
          changed = true;
        });
      });
      return changed ? { ...state, schema: 9, history: mergeHistory(history, []), updatedAt: Math.max(Date.now(), safeTime(state.updatedAt)) } : state;

    const normalizeHealthPayload = raw => {
      const value = raw?.data && typeof raw.data === 'object' ? raw.data : raw;
      if (!value || typeof value !== 'object') return null;
      const sourceTimestamp = value.timestamp || value.date || new Date().toISOString();
      const parsedTimestamp = new Date(sourceTimestamp);
      const timestamp = Number.isNaN(parsedTimestamp.getTime()) ? new Date().toISOString() : parsedTimestamp.toISOString();
      let fat = healthNumber(value.fat ?? value.bodyFat);
      if (fat != null && fat > 0 && fat <= 1) fat *= 100;
      let height = healthNumber(value.height);
      if (height != null && height > 0 && height < 3) height *= 100;
      const sourceId = String(value.id || 'health');
      const entry = {
        id: `${sourceId}::${timestamp}`,
        timestamp,
        height,
        weight: healthNumber(value.weight),
        fat,
        muscle: healthNumber(value.muscle ?? value.skeletalMuscle),

        sleepHours: healthNumber(value.sleepHours ?? value.sleep),
        workoutMinutes: healthNumber(value.workoutMinutes ?? value.workout)
      };
      const metricKeys = ['height', 'weight', 'fat', 'muscle', 'steps', 'activeEnergy', 'restingHeartRate', 'sleepHours', 'workoutMinutes'];
      if (!metricKeys.some(key => entry[key] != null && entry[key] >= 0)) return null;
      entry.steps = entry.steps == null ? null : Math.round(entry.steps);
      return entry;
    };

    const applyHealthPayload = (state, raw) => {
      const incomingEntry = normalizeHealthPayload(raw);
      if (!incomingEntry || state.health?.lastImportId === incomingEntry.id) return state;
      const measurementId = `health-${incomingEntry.id}`;
      const deletedMetrics = new Set((state.measurementTombstones || []).filter(item => item.id === measurementId).map(item => item.metric));
      const entry = { ...incomingEntry };
      deletedMetrics.forEach(metric => { delete entry[metric]; });
      const previousHealth = state.health || {};
      const previousHistory = Array.isArray(previousHealth.history) ? previousHealth.history : [];
      const history = [...previousHistory.filter(item => item.id !== entry.id), entry]
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const hasBodyMetrics = ['height', 'weight', 'muscle', 'fat'].some(key => Number(entry[key]) > 0);

    }

    function ExerciseDiagram({ exercise }) {
      const cardio = exercise.kind === 'cardio';
      const dayId = exercise.id.split('-')[0];
      const row = Math.max(0, Number(exercise.id.split('-')[1] || 1) - 1);
      const src = cardio ? CARDIO_SHEET : TECHNIQUE_SHEETS[dayId];
      return <div className="mt-4 overflow-hidden rounded-2xl border border-cyan/15 bg-white shadow-blueglow">
        <div className="flex items-center justify-between border-b border-white/5 bg-[#0b1114] px-3 py-2"><span className="text-[10px] font-black uppercase tracking-[.16em] text-cyan"><Icon name="person-chalkboard" className="mr-2"/>Техника выполнения</span><span className="text-[9px] text-muted">мышцы выделены красным</span></div>
        <div className="relative overflow-hidden bg-white" style={{ aspectRatio: cardio ? '2 / 1' : '10 / 3' }}>
          <img src={src} loading="lazy" decoding="async" alt={cardio ? 'Дорожка, эллипс и велотренажёр — варианты финишного кардио' : `${exercise.name}: исходное и конечное положение`} className="absolute left-0 w-full max-w-none" style={cardio ? { top: 0 } : { top: `-${row * 100}%` }} />
          {!cardio && <><span className="absolute left-2 top-2 rounded-full bg-black/70 px-2 py-1 text-[9px] font-black text-white">СТАРТ</span><span className="absolute right-2 top-2 rounded-full bg-neon px-2 py-1 text-[9px] font-black text-ink">ФИНИШ</span></>}
        </div>
      </div>;
    }

    function CardioCard({ exercise, index, entry, previousEntry, onChange }) {
      const minutes = entry?.reps?.[0] ?? '';
      const modes = [{ id: 'walk', label: 'Дорожка', icon: 'person-walking' }, { id: 'ellipse', label: 'Эллипс', icon: 'person-running' }, { id: 'bike', label: 'Вело', icon: 'bicycle' }];
      const intensity = [{ id: 'easy', label: 'Легко' }, { id: 'optimal', label: 'Умеренно' }, { id: 'hard', label: 'Тяжело' }];
      const good = entry?.completed && Number(minutes) >= 8 && Number(minutes) <= 15 && entry?.rpe !== 'hard';
      return <Card className={`overflow-hidden transition ${entry?.completed ? 'border-cyan/40 shadow-blueglow' : 'border-cyan/20'}`}>
        <div className="p-4 sm:p-5">
          <div className="flex gap-3"><div className={`grid h-10 w-10 shrink-0 place-items-center rounded-2xl font-black ${entry?.completed ? 'bg-cyan text-ink' : 'bg-cyan/10 text-cyan'}`}>{entry?.completed ? <Icon name="check"/> : index + 1}</div><div className="min-w-0 flex-1"><h3 className="font-black">Финишное кардио</h3><p className="mt-1 text-xs text-muted">8–15 минут после силовой части</p></div><span className="h-fit rounded-full bg-cyan/10 px-2.5 py-1 text-[11px] font-black text-cyan">8–15 мин</span></div>
          <ExerciseDiagram exercise={exercise}/>
          {previousEntry && <div className="mt-4 flex items-center justify-between gap-3 rounded-2xl border border-cyan/15 bg-cyan/[.05] p-3"><div><span className="block text-[10px] font-black uppercase tracking-wider text-cyan">Прошлый раз</span><b className="mt-1 block text-sm">{previousEntry.reps?.[0] || '—'} мин · {modes.find(mode => mode.id === previousEntry.mode)?.label || 'кардио'}</b></div><button onClick={() => onChange({ reps: [...(previousEntry.reps || [''])], mode: previousEntry.mode || '', rpe: previousEntry.rpe || '' })} className="h-10 rounded-xl bg-white/8 px-3 text-xs font-black">Повторить</button></div>}
          <div className="mt-4 rounded-2xl border border-amber-300/10 bg-amber-300/[.04] px-3 py-2 text-xs text-amber-100/80"><Icon name="shield-halved" className="mr-2 text-amber-300"/>Разговорный темп, без бега, ударной нагрузки и чрезмерного наклона.</div>
          <span className="mb-2 mt-4 block text-[11px] font-bold uppercase tracking-wider text-muted">Тренажёр</span><div className="grid grid-cols-3 gap-2">{modes.map(m => <button key={m.id} onClick={() => onChange({ mode: m.id })} className={`min-h-[58px] rounded-2xl border px-2 text-xs font-bold ${entry?.mode === m.id ? 'border-cyan bg-cyan/10 text-cyan' : 'border-line bg-white/[.025] text-muted'}`}><Icon name={m.icon} className="mb-1 block"/>{m.label}</button>)}</div>
          <div className="mt-4 grid grid-cols-[105px_1fr] gap-3"><label><span className="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-muted">Минуты</span><input aria-label="Минуты кардио" type="number" inputMode="numeric" min="0" max="90" value={minutes} onChange={e => onChange({ reps: [e.target.value] })} placeholder="12" className="h-14 w-full rounded-2xl border border-line bg-black/25 px-3 text-center text-lg font-black outline-none focus:border-cyan"/></label><div><span className="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-muted">Интенсивность</span><div className="grid grid-cols-3 gap-2">{intensity.map(i => <button key={i.id} onClick={() => onChange({ rpe: i.id })} className={`h-14 rounded-2xl border px-1 text-[10px] font-black ${entry?.rpe === i.id ? (i.id === 'hard' ? 'border-amber-300 bg-amber-300/10 text-amber-200' : 'border-neon bg-neon/10 text-neon') : 'border-line bg-white/[.025] text-muted'}`}>{i.label}</button>)}</div></div></div>
          <button onClick={() => onChange({ completed: !entry?.completed })} className={`mt-4 min-h-[54px] w-full rounded-2xl px-4 font-black transition active:scale-[.98] ${entry?.completed ? 'bg-cyan text-ink' : 'bg-white/8 text-white'}`}><Icon name={entry?.completed ? 'circle-check' : 'circle'} className="mr-2"/>{entry?.completed ? 'Кардио выполнено' : 'Завершить кардио'}</button>
        </div>
        {entry?.completed && <div className={`border-t px-4 py-4 ${good ? 'border-neon/20 bg-neon/[.08]' : 'border-amber-300/20 bg-amber-300/[.08]'}`}><div className="flex gap-3"><Icon name={good ? 'heart-circle-check' : 'heart-pulse'} className={good ? 'mt-1 text-neon' : 'mt-1 text-amber-300'}/><div><p className="text-sm font-black">{good ? 'Финиш закрыт!' : 'Слушай пульс и дыхание'}</p><p className="mt-1 text-xs leading-relaxed text-white/70">{good ? `${minutes} минут умеренного кардио — отличный объём для восстановления и выносливости.` : 'Ориентир — 8–15 минут в разговорном темпе. Если устал после силовой, не форсируй нагрузку.'}</p></div></div></div>}
      </Card>;
    }

    function getRecommendation(exercise, entry) {
      if (exercise.kind === 'cardio') return entry?.completed ? { tone: 'cardio', title: 'Кардио выполнено', text: 'Финишная аэробная работа учтена отдельно от силового тоннажа.' } : null;
      if (!entry?.completed) return null;
      if (!entry.rpe) return { tone: 'neutral', title: 'Оцени сложность', text: 'Выбери RPE — так рекомендация на следующую тренировку будет точнее.' };
      const reps = Array.from({ length: exercise.sets }, (_, i) => Number(entry.reps?.[i] || 0));
      const allAtTop = reps.every(r => r >= exercise.max);
      const loadReady = exercise.kind === 'bodyweight' || Number(entry.weight) > 0;
      if (allAtTop && loadReady && (entry.rpe === 'easy' || entry.rpe === 'optimal')) {
        if (exercise.kind === 'bodyweight') return { tone: 'success', title: 'Отличная работа!', text: `На следующей неделе добавь 5–10 секунд к подходу или усложни вариант, сохраняя идеальную технику.` };
        const delta = exercise.kind === 'dumbbell' ? '1–2 кг' : '2.5–5 кг';
        const w = Number(entry.weight || 0);
        const exact = exercise.kind === 'dumbbell' ? `${formatNumber(w + 1, 1)}–${formatNumber(w + 2, 1)} кг` : `${formatNumber(w + 2.5, 1)}–${formatNumber(w + 5, 1)} кг`;
        return { tone: 'success', title: 'Отличная работа!', text: `На следующей неделе увеличь вес на +${delta} (${exercise.kind === 'dumbbell' ? 'для гантелей' : 'для блочного тренажёра'}). Ориентир: ${exact}.` };
      }
      const w = Number(entry.weight || 0);
      const reduced = w ? ` Если техника распадается — попробуй ${formatNumber(w * .9, 1)} кг.` : '';
      return { tone: 'care', title: 'Ты выложился на максимум!', text: `Так как важно беречь спину при сколиозе и не перегружать ЦНС, на следующей тренировке оставь этот же вес или снизь на 10% для идеальной техники.${reduced}` };
    }

    function ExerciseCard({ exercise, index, entry, previousEntry, onChange, onStartTimer }) {
      const reps = entry?.reps || Array(exercise.sets).fill('');
      const recommendation = getRecommendation(exercise, entry);
      const tone = recommendation?.tone;
      return (
        <Card className={`overflow-hidden transition ${entry?.completed ? 'border-neon/35' : ''}`}>
          <div className="p-4 sm:p-5">
            <div className="flex gap-3">
              <div className={`grid h-10 w-10 shrink-0 place-items-center rounded-2xl font-black ${entry?.completed ? 'bg-neon text-ink' : 'bg-white/7 text-muted'}`}>{entry?.completed ? <Icon name="check" /> : index + 1}</div>
              <div className="min-w-0 flex-1">
                <h3 className="font-black leading-tight text-white">{exercise.name}</h3>
                <p className="mt-1 text-xs text-muted">{exercise.detail} · {exercise.sets} × {exercise.min === exercise.max ? exercise.max : `${exercise.min}–${exercise.max}`} {exercise.unit || 'повт.'}</p>
              </div>
              <span className="h-fit whitespace-nowrap rounded-full bg-cyan/10 px-2.5 py-1 text-[11px] font-black text-cyan">{exercise.load}</span>
            </div>

            {previousEntry && <div className="mt-4 flex items-center justify-between gap-3 rounded-2xl border border-cyan/15 bg-cyan/[.05] p-3"><div className="min-w-0"><span className="block text-[10px] font-black uppercase tracking-wider text-cyan">Прошлый результат</span><b className="mt-1 block truncate text-sm">{exercise.kind !== 'bodyweight' && Number(previousEntry.weight) > 0 ? `${formatNumber(previousEntry.weight, 1)} кг · ` : ''}{(previousEntry.reps || []).filter(value => value !== '').join(' / ') || '—'} {exercise.unit || 'повт.'}</b></div><button onClick={() => onChange({ weight: previousEntry.weight == null ? '' : String(previousEntry.weight), reps: [...(previousEntry.reps || [])], rpe: previousEntry.rpe || '' })} className="h-10 shrink-0 rounded-xl bg-white/8 px-3 text-xs font-black">Повторить</button></div>}

            <div className="mt-4 rounded-2xl border border-amber-300/10 bg-amber-300/[.04] px-3 py-2 text-xs text-amber-100/80"><Icon name="shield-halved" className="mr-2 text-amber-300" />{exercise.cue}</div>

            <ExerciseDiagram exercise={exercise} />

            <div className={`mt-4 grid gap-3 ${exercise.kind === 'bodyweight' ? '' : 'grid-cols-[112px_1fr]'}`}>
              {exercise.kind !== 'bodyweight' && <label className="block">
                <span className="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-muted">Вес, кг</span>
                <input type="number" inputMode="decimal" min="0" step="0.5" value={entry?.weight ?? ''} onChange={e => onChange({ weight: e.target.value })} placeholder={exercise.load.replace(/[^0-9.,–-]/g, '')} className="h-14 w-full rounded-2xl border border-line bg-black/25 px-4 text-center text-lg font-black outline-none focus:border-cyan" />
              </label>}
              <div>
                <span className="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-muted">Повторения по подходам</span>
                <div className="grid grid-cols-3 gap-2">
                  {Array.from({ length: exercise.sets }, (_, i) => <label key={i} className="relative">
                    <input aria-label={`Подход ${i + 1}`} type="number" inputMode="numeric" min="0" max="999" value={reps[i] ?? ''} onChange={e => { const next = [...reps]; next[i] = e.target.value; onChange({ reps: next }); }} placeholder={String(exercise.max)} className="h-14 w-full rounded-2xl border border-line bg-black/25 px-2 pt-3 text-center text-lg font-black outline-none focus:border-neon" />
                    <span className="pointer-events-none absolute left-0 right-0 top-1 text-center text-[9px] font-bold uppercase text-muted">{i + 1} сет</span>
                  </label>)}
                </div>
              </div>
            </div>

            <div className="mt-4">
              <span className="mb-2 block text-[11px] font-bold uppercase tracking-wider text-muted">Субъективная сложность (RPE)</span>
              <div className="grid grid-cols-3 gap-2">
                {RPE_OPTIONS.map(r => <button key={r.id} onClick={() => onChange({ rpe: r.id })} className={`min-h-[62px] rounded-2xl border px-2 py-2 text-center transition active:scale-95 ${entry?.rpe === r.id ? (r.id === 'hard' ? 'border-amber-300 bg-amber-300/12 text-amber-200' : 'border-cyan bg-cyan/12 text-cyan') : 'border-line bg-white/[.025] text-muted'}`}>
                  <Icon name={r.icon} className="mb-1 block" /><span className="block text-[11px] font-black leading-tight">{r.label}</span>{r.sub && <span className="block text-[9px]">{r.sub}</span>}
                </button>)}
              </div>
            </div>

            <div className="mt-4 flex gap-2">
              <button onClick={() => onChange({ completed: !entry?.completed })} className={`min-h-[54px] flex-1 rounded-2xl px-4 font-black transition active:scale-[.98] ${entry?.completed ? 'bg-neon text-ink shadow-glow' : 'bg-white/8 text-white'}`}>
                <Icon name={entry?.completed ? 'circle-check' : 'circle'} className="mr-2" />{entry?.completed ? 'Выполнено' : 'Отметить выполненным'}
              </button>
              <button onClick={() => onStartTimer(90)} className="grid min-h-[54px] w-14 place-items-center rounded-2xl border border-line bg-white/[.04] text-cyan" aria-label="Запустить отдых 90 секунд"><Icon name="stopwatch" /></button>
            </div>
          </div>

          {recommendation && <div className={`border-t px-4 py-4 ${tone === 'success' ? 'border-neon/20 bg-neon/[.08]' : tone === 'care' ? 'border-amber-300/20 bg-amber-300/[.08]' : 'border-line bg-white/[.025]'}`}>
            <div className="flex gap-3">
              <Icon name={tone === 'success' ? 'arrow-trend-up' : tone === 'care' ? 'heart-pulse' : 'sliders'} className={`mt-1 ${tone === 'success' ? 'text-neon' : tone === 'care' ? 'text-amber-300' : 'text-cyan'}`} />
              <div><p className="text-sm font-black">{recommendation.title}</p><p className="mt-1 text-xs leading-relaxed text-white/70">{recommendation.text}</p></div>
            </div>
          </div>}
        </Card>
      );
    }

    function WorkoutView({ data, selectedDay, setSelectedDay, weekKey, updateExercise, updateWorkoutNote, addProtein, resetProtein, startTimer, analysisOpen, setAnalysisOpen }) {
      const workout = DAYS.find(d => d.id === selectedDay) || DAYS[0];
      const dayData = data.weeks?.[weekKey]?.[workout.id] || {};
      const entries = dayData.exercises || {};
      const previousWorkout = [...(data.history || [])].filter(record => record.workoutId === workout.id && record.id !== `${weekKey}-${workout.id}`).sort((a, b) => safeTime(b.completedAt || b.date) - safeTime(a.completedAt || a.date))[0];
      const previousEntries = Object.fromEntries((previousWorkout?.exercises || []).map(exercise => [exercise.id, exercise]));
      const workoutDuration = dayData.startedAt && dayData.completedAt ? Math.max(1, Math.round((safeTime(dayData.completedAt) - safeTime(dayData.startedAt)) / 60000)) : null;
      const completeCount = workout.exercises.filter(ex => entries[ex.id]?.completed).length;
      const successCount = workout.exercises.filter(ex => getRecommendation(ex, entries[ex.id])?.tone === 'success').length;
      const tonnage = workout.exercises.reduce((sum, ex) => {
        const e = entries[ex.id];
        if (!e?.completed || !ex.multiplier) return sum;
        return sum + Number(e.weight || 0) * (e.reps || []).reduce((a, r) => a + Number(r || 0), 0) * ex.multiplier;
      }, 0);
      return (
        <div className="space-y-5">
          <div className="grid gap-5 lg:grid-cols-[1.4fr_.8fr]">
            <Card className="relative overflow-hidden p-5 grid-bg">
              <div className="absolute -right-16 -top-20 h-52 w-52 rounded-full bg-neon/10 blur-3xl"></div>
              <p className="text-xs font-black uppercase tracking-[.2em] text-neon">Тренируйся умно</p>
              <h1 className="mt-2 max-w-xl text-3xl font-black leading-[1.04] sm:text-4xl">Сильнее каждую неделю.<br/><span className="text-white/45">Фиксируй каждый результат.</span></h1>
              <div className="mt-5 grid grid-cols-3 gap-2">
                {[[formatNumber(data.profile.weight, 1),'кг вес'],[formatNumber(data.profile.muscle, 1),'кг мышц'],[`${formatNumber(data.profile.fat, 1)}%`,'жир']].map(([v,l]) => <div key={l} className="rounded-2xl border border-white/5 bg-black/20 p-3"><b className="block text-lg">{v}</b><span className="text-[10px] uppercase tracking-wider text-muted">{l}</span></div>)}
              </div>
            </Card>
            <ProteinTracker data={data.protein} goal={data.profile.proteinGoal} onAdd={addProtein} onReset={resetProtein} />
          </div>

          <div className="overflow-x-auto hide-scrollbar">
            <div className="flex min-w-max gap-2">
              {DAYS.map(day => {
                const dEntries = data.weeks?.[weekKey]?.[day.id]?.exercises || {};
                const done = day.exercises.every(ex => dEntries[ex.id]?.completed);
                return <button key={day.id} onClick={() => setSelectedDay(day.id)} className={`min-w-[88px] rounded-2xl border px-4 py-3 text-left transition ${selectedDay === day.id ? 'border-neon bg-neon text-ink shadow-glow' : done ? 'border-neon/25 bg-neon/[.06] text-neon' : 'border-line bg-panel text-muted'}`}>
                  <span className="block text-xs font-black">{day.short}</span><span className="mt-1 block text-[10px] font-bold">{done ? 'ГОТОВО' : day.exercises.filter(ex => dEntries[ex.id]?.completed).length + `/${day.exercises.length}`}</span>
                </button>;
              })}
            </div>
          </div>

          <Card className="overflow-hidden">
            <div className="p-5">
              <div className="flex items-start justify-between gap-3">
                <div><p className="text-xs font-black uppercase tracking-[.16em] text-cyan">{workout.label}</p><h2 className="mt-1 text-xl font-black">{workout.title}</h2></div>
                <div className="rounded-2xl bg-white/5 px-3 py-2 text-right"><b className="block text-lg">{completeCount}/{workout.exercises.length}</b><span className="text-[10px] text-muted">пунктов</span></div>
              </div>
              <div className="mt-4"><ProgressBar value={completeCount} max={workout.exercises.length} /></div>
              {dayData.startedAt && <div className="mt-3 flex flex-wrap gap-2 text-[11px] font-bold text-muted"><span className="rounded-full bg-white/5 px-3 py-1.5"><Icon name="clock" className="mr-1 text-cyan"/>Начало {new Date(dayData.startedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>{workoutDuration && <span className="rounded-full bg-white/5 px-3 py-1.5"><Icon name="stopwatch" className="mr-1 text-neon"/>{workoutDuration} мин</span>}</div>}
              <div className="mt-4 flex items-start gap-3 rounded-2xl border border-amber-300/15 bg-amber-300/[.05] p-3 text-xs leading-relaxed text-amber-100/80"><Icon name="triangle-exclamation" className="mt-0.5 text-amber-300" /><span><b className="text-amber-200">Контроль при сколиозе:</b> техника важнее цифры. Избегай чрезмерной осевой нагрузки, боли и рывков.</span></div>
            </div>
          </Card>

          <div className="space-y-4">
            {workout.exercises.map((exercise, index) => exercise.kind === 'cardio'
              ? <CardioCard key={exercise.id} exercise={exercise} index={index} entry={entries[exercise.id] || { reps: [''], rpe: '', mode: '', completed: false }} previousEntry={previousEntries[exercise.id]} onChange={patch => updateExercise(workout.id, exercise.id, patch)} />
              : <ExerciseCard key={exercise.id} exercise={exercise} index={index} entry={entries[exercise.id] || { reps: Array(exercise.sets).fill(''), weight: '', rpe: '', completed: false }} previousEntry={previousEntries[exercise.id]} onChange={patch => updateExercise(workout.id, exercise.id, patch)} onStartTimer={startTimer} />)}
          </div>

          <Card className="p-5">
            <label className="block"><span className="text-xs font-black uppercase tracking-wider text-cyan">Заметка к тренировке</span><textarea value={dayData.note || ''} onChange={event => updateWorkoutNote(workout.id, event.target.value)} maxLength="800" placeholder="Самочувствие, техника, что изменить в следующий раз…" className="mt-3 h-28 w-full resize-none rounded-2xl border border-line bg-black/25 p-4 text-sm leading-relaxed outline-none focus:border-cyan" /></label>
            <p className="mt-2 text-right text-[10px] text-muted">{String(dayData.note || '').length}/800 · сохраняется автоматически</p>
          </Card>

          <Card className="p-5">
            <div className="flex items-center justify-between gap-4"><div><p className="text-xs font-black uppercase tracking-wider text-neon">Анализ тренировки</p><h3 className="mt-1 text-lg font-black">{successCount ? `${successCount} упражн. готовы к прогрессии` : 'Заполни подходы и RPE'}</h3></div><button onClick={() => setAnalysisOpen(true)} className="h-12 rounded-2xl bg-white/8 px-4 font-bold text-cyan">Открыть</button></div>
            <div className="mt-4 grid grid-cols-3 gap-2 text-center"><div className="rounded-xl bg-black/20 p-3"><b>{completeCount}</b><span className="block text-[10px] text-muted">готово</span></div><div className="rounded-xl bg-black/20 p-3"><b className="text-neon">{successCount}</b><span className="block text-[10px] text-muted">повысить вес</span></div><div className="rounded-xl bg-black/20 p-3"><b>{formatNumber(tonnage)}</b><span className="block text-[10px] text-muted">кг тоннаж</span></div></div>
          </Card>

          <Modal open={analysisOpen} onClose={() => setAnalysisOpen(false)} wide>
            <p className="text-xs font-black uppercase tracking-[.18em] text-cyan">Умный разбор</p><h2 className="mt-2 pr-12 text-2xl font-black">{workout.title}</h2>
            <div className="mt-5 space-y-3">
              {workout.exercises.map(ex => {
                const rec = getRecommendation(ex, entries[ex.id]);

    function MiniLineChart({ points, color = '#8dfc63', suffix = '', emptyText = 'Данные появятся после первой завершённой тренировки', onPointClick }) {
      if (!points.length) return <div className="grid h-44 place-items-center rounded-2xl border border-dashed border-line px-5 text-center text-sm text-muted">{emptyText}</div>;
      const width = Math.max(340, points.length * 72), height = 170, padX = 28, padY = 24;
      const values = points.map(p => Number(p.value || 0));
      const min = Math.min(...values), max = Math.max(...values);
      const range = max - min || 1;
      const coords = points.map((p, i) => ({ x: points.length === 1 ? width / 2 : padX + i * (width - padX * 2) / (points.length - 1), y: height - padY - (Number(p.value) - min) / range * (height - padY * 2), ...p }));
      return <div className="overflow-x-auto rounded-2xl bg-black/20 p-2 hide-scrollbar"><div className="relative" style={{ width: `${width}px`, minWidth: '100%', height: `${height}px` }}>
        <svg viewBox={`0 0 ${width} ${height}`} className="pointer-events-none absolute inset-0 h-full w-full" role="img" aria-label="График прогресса">
          {[0,1,2,3].map(i => <line key={i} x1="18" x2={width - 12} y1={25 + i * 40} y2={25 + i * 40} stroke="rgba(255,255,255,.07)" />)}
          {coords.length > 1 && <polyline fill="none" stroke={color} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" points={coords.map(p => `${p.x},${p.y}`).join(' ')} />}
          {coords.map((p, i) => <g key={p.id || i}><circle cx={p.x} cy={p.y} r="6" fill="#0a0d0f" stroke={color} strokeWidth="4"/><text x={p.x} y={Math.max(13, p.y - 12)} fill="white" textAnchor="middle" fontSize="11" fontWeight="800">{formatNumber(p.value, 1)}{suffix}</text><text x={p.x} y={height - 5} fill="#8d9aa3" textAnchor="middle" fontSize="9">{p.label}</text></g>)}
        </svg>
        {onPointClick && coords.map((p, i) => <button type="button" key={`hit-${p.id || i}`} onClick={() => onPointClick(p)} aria-label={`Выбрать значение ${formatNumber(p.value, 2)}${suffix} за ${p.label}`} className="absolute z-10 h-11 w-11 touch-manipulation rounded-full focus:outline-none focus:ring-2 focus:ring-cyan active:bg-cyan/20" style={{ left: `${p.x / width * 100}%`, top: `${p.y / height * 100}%`, transform: 'translate(-50%, -50%)' }}><span className="sr-only">{formatNumber(p.value, 2)}{suffix}</span></button>)}
      </div></div>;
    }

          <div className="mt-4"><MiniLineChart points={tonnagePoints} color="#3fd6ff" /></div>

    function parseFirebaseConfig(raw) {
      let text = String(raw || '').trim();
      const start = text.indexOf('{'), end = text.lastIndexOf('}');
      if (start >= 0 && end > start) text = text.slice(start, end + 1);
      text = text.replace(/([{,]\s*)([A-Za-z_$][\w$]*)(\s*:)/g, '$1"$2"$3').replace(/,\s*}/g, '}');
      const config = JSON.parse(text);
      if (!config.apiKey || !config.projectId || !config.databaseURL) throw new Error('Нужны apiKey, projectId и databaseURL.');
      return config;
    }

    function CloudModal({ open, onClose, current, onSave, onDisconnect, status, error }) {
      const [raw, setRaw] = useState(current?.config ? JSON.stringify(current.config, null, 2) : '');

      const [localError, setLocalError] = useState('');
      useEffect(() => { if (open) { setRaw(current?.config ? JSON.stringify(current.config, null, 2) : ''); setCode(current?.syncCode || ''); setLocalError(''); } }, [open, current]);
      const generateCode = () => {
        const bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
        setCode(Array.from(bytes, b => b.toString(16).padStart(2, '0')).join(''));
      };
      const save = () => {
        try { const config = parseFirebaseConfig(raw); if (code.trim().length < 12) throw new Error('Код синхронизации — минимум 12 символов.'); onSave({ config, syncCode: code.trim() }); setLocalError(''); }
        catch (e) { setLocalError(e.message || 'Проверь данные.'); }
      };
      return <Modal open={open} onClose={onClose} wide>
        <p className="text-xs font-black uppercase tracking-[.18em] text-cyan">Realtime Database</p><h2 className="mt-2 pr-12 text-2xl font-black">Подключить облако</h2>

        <label className="mt-5 block"><span className="mb-2 block text-xs font-black uppercase tracking-wider text-muted">firebaseConfig</span><textarea value={raw} onChange={e => setRaw(e.target.value)} spellCheck="false" placeholder={'{\n  "apiKey": "...",\n  "databaseURL": "https://...firebaseio.com",\n  "projectId": "..."\n}'} className="h-52 w-full rounded-2xl border border-line bg-black/30 p-4 font-mono text-xs leading-relaxed outline-none focus:border-cyan" /></label>

        {(localError || error) && <div className="mt-4 rounded-2xl border border-red-400/20 bg-red-400/10 p-3 text-sm text-red-200">{localError || error}</div>}

      const mutate = (updater) => setData(prev => {
        const candidate = typeof updater === 'function' ? updater(prev) : updater;
        if (candidate === prev) return prev;
        const next = { ...candidate, schema: 9, updatedAt: Date.now() };
        dataRef.current = next;

        return next;
      });

      useEffect(() => { dataRef.current = data; persistState(data, false); }, [data]);

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            [0, .22, .44].forEach(offset => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = 720 + offset * 200; gain.gain.setValueAtTime(.15, ctx.currentTime + offset); gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + offset + .16); osc.start(ctx.currentTime + offset); osc.stop(ctx.currentTime + offset + .18); });
          } catch {}
          if (navigator.vibrate) navigator.vibrate([180, 100, 180]);
          return;
        }
        const id = setTimeout(() => setTimer(v => Math.max(0, v - 1)), 1000);
        return () => clearTimeout(id);
      }, [timerRunning, timer]);

      const startTimer = (seconds) => { setTimerDone(false); setTimer(seconds); setTimerRunning(true); };
      const updateExercise = (dayId, exerciseId, patch) => mutate(prev => {
        const now = Date.now();
        const weeks = { ...prev.weeks };
        const week = { ...(weeks[weekKey] || {}) };
        const day = { ...(week[dayId] || {}) };
        const exercises = { ...(day.exercises || {}) };
        const exercise = DAYS.find(d => d.id === dayId).exercises.find(e => e.id === exerciseId);
        exercises[exerciseId] = { reps: Array(exercise.sets).fill(''), weight: '', rpe: '', completed: false, ...(exercises[exerciseId] || {}), ...patch, _updatedAt: now };
        day.exercises = exercises;
        day.startedAt = day.startedAt || now;
        const workout = DAYS.find(item => item.id === dayId);
        const allComplete = workout.exercises.every(item => exercises[item.id]?.completed);
        day.completedAt = allComplete ? (day.completedAt || now) : null;
        day.updatedAt = now; week[dayId] = day; weeks[weekKey] = week;
        const draft = { ...prev, weeks };
        const recordId = `${weekKey}-${dayId}`;
        const existing = prev.history.find(record => record.id === recordId);
        const record = workoutRecordFor(draft, weekKey, dayId, existing);
        if (!record || record === existing) return draft;
        const history = existing ? prev.history.map(item => item.id === recordId ? record : item) : [...prev.history, record];
        return { ...draft, history };
      });
      const updateWorkoutNote = (dayId, note) => mutate(prev => {
        const now = Date.now();
        const weeks = { ...prev.weeks };
        const week = { ...(weeks[weekKey] || {}) };
        const day = { ...(week[dayId] || {}), note: String(note || '').slice(0, 800), updatedAt: now };
        week[dayId] = day; weeks[weekKey] = week;
        const draft = { ...prev, weeks };
        const recordId = `${weekKey}-${dayId}`;
        const existing = prev.history.find(record => record.id === recordId);
        const record = workoutRecordFor(draft, weekKey, dayId, existing);
        if (!record || record === existing) return draft;
        return { ...draft, history: existing ? prev.history.map(item => item.id === recordId ? record : item) : [...prev.history, record] };
      });
      const proteinState = (prev, grams) => {
        const updatedAt = Date.now();
        const currentDay = todayKey();
        const previousEntries = prev.protein?.date && prev.protein.date !== currentDay ? [{ ...prev.protein, updatedAt: prev.updatedAt }] : [];
        const protein = { date: currentDay, grams: Math.max(0, Math.round(Number(grams || 0) * 10) / 10) };
        return { ...prev, protein, proteinHistory: mergeProteinHistory(prev.proteinHistory, [...previousEntries, { ...protein, updatedAt }]) };
      };
      const addProtein = amount => mutate(prev => proteinState(prev, (prev.protein.date === todayKey() ? Number(prev.protein.grams || 0) : 0) + Number(amount || 0)));
      const resetProtein = () => mutate(prev => proteinState(prev, 0));
      const updateProfile = values => mutate(prev => {
        const timestamp = new Date().toISOString();
        const profile = { ...prev.profile, ...values };
        const bodyChanged = ['height', 'weight', 'muscle', 'fat'].some(key => Number(profile[key]) !== Number(prev.profile[key]));
        if (!bodyChanged) return { ...prev, profile };
        const measurement = { id: `manual-${Date.now()}`, timestamp, source: 'manual', height: profile.height, weight: profile.weight, muscle: profile.muscle, fat: profile.fat };
        return { ...prev, profile, measurements: mergeMeasurements(prev.measurements, [measurement]) };
      });
      const deleteMeasurementMetric = (measurementId, metric) => {
        const allowedMetrics = ['height', 'weight', 'muscle', 'fat'];
        const measurement = dataRef.current.measurements?.find(item => item.id === measurementId);
        if (!measurement || !allowedMetrics.includes(metric) || Number(measurement[metric]) <= 0) return;
        mutate(prev => {
          const measurementTombstones = mergeMeasurementTombstones(prev.measurementTombstones, [{ id: measurementId, metric, deletedAt: Date.now() }]);
          const measurements = (prev.measurements || []).map(item => {
            if (item.id !== measurementId) return item;
            const next = { ...item }; delete next[metric]; return next;
          }).filter(item => ['height', 'weight', 'muscle', 'fat'].some(key => Number(item?.[key]) > 0));
          const previous = [...measurements].filter(item => Number(item?.[metric]) > 0).sort((a, b) => safeTime(b.timestamp) - safeTime(a.timestamp))[0];
          const profile = { ...prev.profile, [metric]: previous ? Number(previous[metric]) : '' };
          const sourceHealthId = measurementId.startsWith('health-') ? measurementId.slice(7) : '';
          const healthHistory = (prev.health?.history || []).map(item => {
            if (!sourceHealthId || item.id !== sourceHealthId) return item;
            const next = { ...item }; delete next[metric]; return next;
          });
          const healthLatest = { ...(prev.health?.latest || {}) };
          if (sourceHealthId && healthLatest.id === sourceHealthId) {
            delete healthLatest[metric];
            const previousHealth = [...healthHistory].reverse().find(item => Number(item?.[metric]) > 0);
            if (previousHealth) healthLatest[metric] = previousHealth[metric];
          }
          return { ...prev, profile, measurements, measurementTombstones, health: { ...prev.health, latest: healthLatest, history: healthHistory } };
        });
      };

      const dayStats = useMemo(() => {
        const result = {};
        DAYS.forEach(day => {
          const entries = data.weeks?.[weekKey]?.[day.id]?.exercises || {};
          const allComplete = day.exercises.every(ex => entries[ex.id]?.completed);
          const tonnage = day.exercises.reduce((sum, ex) => {
            const e = entries[ex.id]; if (!e?.completed || !ex.multiplier) return sum;
            return sum + Number(e.weight || 0) * (e.reps || []).reduce((a, r) => a + Number(r || 0), 0) * ex.multiplier;
          }, 0);
          result[day.id] = { allComplete, tonnage, entries };
        });
        return result;
      }, [data.weeks, weekKey]);
      const weeklyDone = DAYS.filter(d => dayStats[d.id]?.allComplete).length;

      useEffect(() => {
        const stats = dayStats[selectedDay];
        if (!stats) return;
        const key = `${weekKey}-${selectedDay}`;
        const was = prevCompleteRef.current[key];
        if (was === false && stats.allComplete) setCompletionOpen(true);
        prevCompleteRef.current[key] = stats.allComplete;
      }, [selectedDay, weekKey, dayStats[selectedDay]?.allComplete]);

      const bytesToBase64 = bytes => { let binary = ''; const step = 0x8000; for (let i = 0; i < bytes.length; i += step) binary += String.fromCharCode(...bytes.subarray(i, i + step)); return btoa(binary); };
      const base64ToBytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
      const hashText = async text => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)))).map(b => b.toString(16).padStart(2, '0')).join('');
      const deriveCloudKey = async (code, projectId) => {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode(`ironflow-v1:${projectId}`), iterations: 180000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      };
      const encryptState = async (state, key) => { const iv = crypto.getRandomValues(new Uint8Array(12)); const payload = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(state))); return { version: 1, updatedAt: state.updatedAt, iv: bytesToBase64(iv), payload: bytesToBase64(new Uint8Array(payload)) }; };
      const decryptState = async (envelope, key) => { const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: base64ToBytes(envelope.iv) }, key, base64ToBytes(envelope.payload)); return normalizeState(JSON.parse(new TextDecoder().decode(plain))); };

      useEffect(() => {
        let alive = true, valueHandler, connectionHandler, healthHandler, ref, connectionRef, healthRef, healthListening = false;
        cloudReadyRef.current = false; cloudRef.current = null; cloudKeyRef.current = null;
        setHealthImportUrl(''); setHealthError('');
        if (!cloudSettings) { setCloudStatus('local'); setCloudError(''); return; }
        if (!window.isSecureContext || !crypto.subtle) { setCloudStatus('local'); setCloudError('Облачное шифрование доступно через HTTPS или localhost. Локальные данные сохранены.'); return; }
        setCloudStatus('connecting'); setCloudError('');
        (async () => {
          try {
            const appName = `ironflow-${cloudSettings.config.projectId}`;
            const app = firebase.apps.find(a => a.name === appName) || firebase.initializeApp(cloudSettings.config, appName);
            const db = app.database();
            const pathHash = await hashText(cloudSettings.syncCode);
            const key = await deriveCloudKey(cloudSettings.syncCode, cloudSettings.config.projectId);
            if (!alive) return;
            const databaseRoot = String(cloudSettings.config.databaseURL || '').replace(/\/$/, '');
            setHealthImportUrl(`${databaseRoot}/ironflowHealth/v1/${pathHash}.json`);
            ref = db.ref(`ironflow/v1/${pathHash}`); healthRef = db.ref(`ironflowHealth/v1/${pathHash}`); connectionRef = db.ref('.info/connected');
            cloudRef.current = ref; cloudKeyRef.current = key;
            connectionHandler = snap => { if (!alive) return; setCloudStatus(snap.val() === true ? 'active' : 'local'); };
            const startHealthInbox = () => {
              if (healthListening || !alive) return;
              healthListening = true;
              healthHandler = async snap => {
                if (!alive || !snap.exists()) return;
                try {
                  const raw = snap.val();
                  if (!normalizeHealthPayload(raw)) {
                    await healthRef.remove();
                    setHealthError('Пакет получен, но в нём нет распознаваемых показателей. Проверь названия полей JSON.');
                    return;
                  }
                  const next = applyHealthPayload(dataRef.current, raw);
                  if (next !== dataRef.current) {
                    dataRef.current = next;
                    persistState(next, true);
                    setData(next);
                  }
                  await healthRef.remove();
                  setHealthError('');
                } catch (e) {
                  setHealthError('Не удалось импортировать пакет Apple Health. Проверь Firebase Rules и повтори запуск команды.');
                }
              };
              healthRef.on('value', healthHandler, () => setHealthError('Firebase не разрешил читать входящие данные. Обнови Rules из инструкции Apple Health.'));
            };
            valueHandler = async snap => {
              if (!alive) return;
              try {
                const envelope = snap.val();
                if (!envelope) {
                  await ref.set(await encryptState(dataRef.current, key));
                  cloudReadyRef.current = true; startHealthInbox(); return;
                }
                const remote = await decryptState(envelope, key);
                const merged = repairCompletedHistory(mergeStateData(dataRef.current, remote));
                const localChanged = JSON.stringify(merged) !== JSON.stringify(dataRef.current);
                const remoteChanged = JSON.stringify(merged) !== JSON.stringify(remote);
                if (localChanged) {
                  suppressCloudRef.current = true;
                  dataRef.current = merged;
                  persistState(merged, true);
                  setData(merged);
                }
                if (remoteChanged) await ref.set(await encryptState(merged, key));
                cloudReadyRef.current = true;
                startHealthInbox();
              } catch (e) { setCloudError('Не удалось расшифровать облако. Проверь код синхронизации.'); setCloudStatus('local'); }
            };
            connectionRef.on('value', connectionHandler); ref.on('value', valueHandler, err => { setCloudError(err.message || 'Firebase отклонил доступ. Проверь Rules.'); setCloudStatus('local'); });
          } catch (e) { if (alive) { setCloudError(e.message || 'Не удалось подключить Firebase.'); setCloudStatus('local'); } }
        })();
        return () => { alive = false; if (ref && valueHandler) ref.off('value', valueHandler); if (healthRef && healthHandler) healthRef.off('value', healthHandler); if (connectionRef && connectionHandler) connectionRef.off('value', connectionHandler); if (cloudTimerRef.current) clearTimeout(cloudTimerRef.current); };
      }, [cloudSettings]);

      useEffect(() => {
        if (suppressCloudRef.current) { suppressCloudRef.current = false; return; }
        if (cloudStatus !== 'active' || !cloudReadyRef.current || !cloudRef.current || !cloudKeyRef.current) return;
        clearTimeout(cloudTimerRef.current);
        cloudTimerRef.current = setTimeout(async () => {
          try { await cloudRef.current.set(await encryptState(dataRef.current, cloudKeyRef.current)); setCloudError(''); }
          catch (e) { setCloudError('Изменения сохранены локально и будут отправлены после восстановления связи.'); setCloudStatus('local'); }
        }, 250);
        return () => clearTimeout(cloudTimerRef.current);
      }, [data, cloudStatus]);

      useEffect(() => {
        const online = () => { if (cloudSettings) setCloudStatus('connecting'); };
        const offline = () => setCloudStatus('local');
        window.addEventListener('online', online); window.addEventListener('offline', offline);
        return () => { window.removeEventListener('online', online); window.removeEventListener('offline', offline); };
      }, [cloudSettings]);

      const saveCloud = settings => { localStorage.setItem(CLOUD_KEY, JSON.stringify(settings)); setCloudSettings(settings); setCloudOpen(false); };
      const disconnectCloud = () => { localStorage.removeItem(CLOUD_KEY); setCloudSettings(null); setCloudStatus('local'); setCloudError(''); setHealthImportUrl(''); setHealthError(''); setCloudOpen(false); };
      const exportData = () => { const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `e-gym-backup-${todayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 500); };
      const importData = event => { const file = event.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const parsed = normalizeState(JSON.parse(reader.result)); mutate(parsed); alert('Резервная копия восстановлена.'); } catch { alert('Не удалось прочитать файл резервной копии.'); } }; reader.readAsText(file); event.target.value = ''; };
      const resetData = () => { if (confirm('Удалить локальный журнал, историю и белок? Это действие нельзя отменить без экспортированной резервной копии.')) { localStorage.removeItem(RECOVERY_KEY); const clean = cloneDefault(); clean.updatedAt = Date.now(); dataRef.current = clean; persistState(clean, false); setData(clean); } };
      const openDay = id => { setSelectedDay(id); setTab('workout'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const selectedWorkout = DAYS.find(d => d.id === selectedDay);

      const nav = [
        { id: 'workout', label: 'Тренировка', icon: 'dumbbell' },
        { id: 'plan', label: 'План', icon: 'calendar-days' },
        { id: 'progress', label: 'Прогресс', icon: 'chart-line' },
        { id: 'profile', label: 'Профиль', icon: 'user' }
      ];

      return <div className="min-h-dvh pb-32">
        <header className="safe-top sticky top-0 z-40 border-b border-line glass">
          <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
            <button onClick={() => { setTab('workout'); window.scrollTo({top:0,behavior:'smooth'}); }} className="flex items-center gap-3 text-left"><span className="grid h-10 w-10 place-items-center rounded-2xl bg-neon text-ink shadow-glow"><Icon name="dumbbell" /></span><span><b className="block text-sm leading-none tracking-wide">E-GYM</b><small className="text-[10px] uppercase tracking-[.18em] text-muted">Train · Track · Grow</small></span></button>
            <button aria-label={cloudStatus === 'active' ? 'Облако активно' : cloudStatus === 'connecting' ? 'Синхронизация облака' : 'Локальный режим. Подключить облако'} onClick={() => setCloudOpen(true)} className={`flex h-10 items-center gap-2 rounded-full border px-3 text-xs font-black ${cloudStatus === 'active' ? 'border-neon/25 bg-neon/10 text-neon' : cloudStatus === 'connecting' ? 'border-cyan/25 bg-cyan/10 text-cyan' : 'border-line bg-white/[.03] text-muted'}`}><span className={`h-2 w-2 rounded-full ${cloudStatus === 'active' ? 'bg-neon' : cloudStatus === 'connecting' ? 'animate-pulse bg-cyan' : 'bg-muted'}`}></span><span className="hidden sm:inline">{cloudStatus === 'active' ? 'Облако активно' : cloudStatus === 'connecting' ? 'Синхронизация' : 'Локальный режим'}</span><Icon name={cloudStatus === 'active' ? 'cloud-arrow-up' : 'hard-drive'} className="sm:hidden" /></button>
          </div>
          <TimerBar timer={timer} setTimer={setTimer} running={timerRunning} setRunning={setTimerRunning} done={timerDone} clearDone={() => setTimerDone(false)} />
        </header>

        <main className="mx-auto max-w-6xl px-4 py-6 sm:py-8">
          {tab === 'workout' && <WorkoutView data={data} selectedDay={selectedDay} setSelectedDay={setSelectedDay} weekKey={weekKey} updateExercise={updateExercise} updateWorkoutNote={updateWorkoutNote} addProtein={addProtein} resetProtein={resetProtein} startTimer={startTimer} analysisOpen={analysisOpen} setAnalysisOpen={setAnalysisOpen} />}
          {tab === 'plan' && <PlanView data={data} weekKey={weekKey} onOpenDay={openDay} />}
          {tab === 'progress' && <ProgressView data={data} deleteMeasurementMetric={deleteMeasurementMetric} />}
          {tab === 'profile' && <ProfileView data={data} cloudStatus={cloudStatus} openCloud={() => setCloudOpen(true)} openHealth={() => setHealthOpen(true)} updateProfile={updateProfile} exportData={exportData} importData={importData} resetData={resetData} />}
        </main>

        <nav className="safe-bottom fixed bottom-0 left-0 right-0 z-50 border-t border-line glass">
          <div className="mx-auto grid max-w-lg grid-cols-4 px-2 pt-2">
            {nav.map(item => <button key={item.id} onClick={() => { setTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className={`min-h-[58px] rounded-2xl px-1 text-center transition ${tab === item.id ? 'text-neon' : 'text-muted'}`}><Icon name={item.icon} className={`block text-lg ${tab === item.id ? 'scale-110' : ''}`} /><span className="mt-1 block text-[10px] font-black">{item.label}</span></button>)}
          </div>
        </nav>

        <CloudModal open={cloudOpen} onClose={() => setCloudOpen(false)} current={cloudSettings} onSave={saveCloud} onDisconnect={disconnectCloud} status={cloudStatus} error={cloudError} />
        <HealthModal open={healthOpen} onClose={() => setHealthOpen(false)} importUrl={healthImportUrl} data={data} error={healthError} />
        <CompletionModal open={completionOpen} onClose={() => setCompletionOpen(false)} workout={selectedWorkout} tonnage={dayStats[selectedDay]?.tonnage || 0} weeklyDone={weeklyDone} durationMinutes={data.weeks?.[weekKey]?.[selectedDay]?.startedAt && data.weeks?.[weekKey]?.[selectedDay]?.completedAt ? Math.max(1, Math.round((safeTime(data.weeks[weekKey][selectedDay].completedAt) - safeTime(data.weeks[weekKey][selectedDay].startedAt)) / 60000)) : null} />
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
